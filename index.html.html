<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel Gestão à Vista</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-void:#0A0D10;
    --bg-panel:#161C21;
    --bg-panel-raised:#212A31;
    --bg-panel-raised-2:#2A343C;
    --accent-amber:#29A9E0;
    --accent-amber-dim:#123244;
    --accent-teal:#31C9B0;
    --accent-teal-dim:#0F3F37;
    --accent-red:#F0895A;
    --accent-red-dim:#442719;
    --accent-violet:#C79BDA;
    --accent-violet-dim:#33253E;
    --text-hi:#FFFFFF;
    --text-mid:#B7C2C9;
    --text-low:#7C8891;
    --line:#333E46;
    --line-soft:#242D33;
    --radius:10px;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(ellipse 1200px 600px at 15% -10%, rgba(41,169,224,0.10), transparent 60%),
      radial-gradient(ellipse 1000px 700px at 100% 10%, rgba(49,201,176,0.07), transparent 60%),
      var(--bg-void);
    color:var(--text-hi);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    overflow-x:hidden;
  }
  ::selection{background:var(--accent-amber); color:#1a1200;}
  .mono{font-family:'JetBrains Mono',monospace;}
  .disp{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em;}
  ::-webkit-scrollbar{width:10px; height:10px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:var(--line); border-radius:6px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--text-low);}

  /* ================= HEADER ================= */
  .topbar{display:flex; align-items:center; justify-content:space-between; padding:18px 28px; background:linear-gradient(180deg, var(--bg-panel), rgba(23,28,36,0.6)); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:40; flex-wrap:wrap; gap:12px;}
  .brand{display:flex; align-items:center; gap:14px;}
  .brand-mark{width:44px; height:44px; border-radius:9px; background:linear-gradient(135deg, var(--accent-amber), #12608A); display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 1px rgba(41,169,224,0.35), 0 8px 22px -6px rgba(41,169,224,0.55); flex-shrink:0;}
  .brand-mark svg{width:24px; height:24px;}
  .brand-title{font-family:'Oswald',sans-serif; font-weight:600; font-size:22px; letter-spacing:0.06em; text-transform:uppercase; line-height:1.1;}
  .brand-sub{font-size:12px; color:var(--text-mid); margin-top:2px; letter-spacing:0.03em;}
  .brand-title[contenteditable="true"], .brand-sub[contenteditable="true"]{outline:none; border-radius:4px; padding:1px 4px; margin:-1px -4px;}
  .brand-title[contenteditable="true"]:hover, .brand-sub[contenteditable="true"]:hover{background:var(--bg-panel-raised);}
  .brand-title[contenteditable="true"]:focus, .brand-sub[contenteditable="true"]:focus{background:var(--bg-panel-raised-2); box-shadow:0 0 0 1px var(--accent-amber);}
  .clockwrap{display:flex; align-items:center; gap:18px;}
  .live-dot{display:flex; align-items:center; gap:7px; font-size:11px; letter-spacing:0.12em; color:var(--accent-teal); font-weight:600;}
  .live-dot .dot{width:8px; height:8px; border-radius:50%; background:var(--accent-teal); box-shadow:0 0 0 3px var(--accent-teal-dim); animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:0.35;}}
  .clock{font-family:'JetBrains Mono',monospace; font-size:26px; font-weight:600; letter-spacing:0.02em; color:var(--text-hi);}
  .datebox{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-mid); text-transform:capitalize; text-align:right;}
  .mode-toggle{display:flex; align-items:center; gap:8px; background:var(--bg-panel-raised); border:1px solid var(--line); padding:6px; border-radius:999px; margin-left:22px;}
  .mode-btn{border:none; background:transparent; color:var(--text-mid); font-family:'Oswald',sans-serif; font-size:12px; letter-spacing:0.08em; text-transform:uppercase; padding:8px 16px; border-radius:999px; cursor:pointer; font-weight:600; display:flex; align-items:center; gap:6px; transition:all .15s ease;}
  .mode-btn svg{width:14px; height:14px;}
  .mode-btn.active{background:var(--accent-amber); color:#1a1200;}
  .mode-btn:not(.active):hover{color:var(--text-hi); background:var(--bg-panel-raised-2);}

  /* ================= TABS ================= */
  .tabbar{display:flex; gap:6px; padding:16px 28px 0 28px; overflow-x:auto;}
  .tabbtn{display:flex; align-items:center; gap:9px; background:var(--bg-panel); border:1px solid var(--line); border-bottom:none; color:var(--text-mid); padding:12px 20px; border-radius:10px 10px 0 0; font-family:'Oswald',sans-serif; font-size:14px; letter-spacing:0.05em; text-transform:uppercase; font-weight:500; cursor:pointer; white-space:nowrap; position:relative; top:1px; transition:all .15s ease;}
  .tabbtn svg{width:16px; height:16px; flex-shrink:0;}
  .tabbtn .count{font-family:'JetBrains Mono',monospace; font-size:11px; background:var(--bg-panel-raised); color:var(--text-mid); padding:1px 7px; border-radius:20px;}
  .tabbtn.active{background:var(--bg-panel-raised); color:var(--text-hi); border-color:var(--line); border-bottom:1px solid var(--bg-panel-raised);}
  .tabbtn.active .count{background:var(--accent-amber); color:#1a1200;}
  .tabbtn:hover:not(.active){color:var(--text-hi);}
  .content-area{background:var(--bg-panel-raised); border:1px solid var(--line); border-radius:0 10px 10px 10px; margin:0 28px 28px 28px; min-height:60vh; padding:26px;}
  .offline-banner{display:flex; align-items:center; justify-content:center; gap:10px; background:var(--accent-red-dim); color:#ffb199; border-bottom:1px solid var(--accent-red); padding:10px 20px; font-size:13px; font-weight:600; text-align:center; position:sticky; top:var(--topbar-h,80px); z-index:39;}
  .offline-banner svg{width:16px; height:16px; flex-shrink:0;}
  .offline-banner button{background:none; border:1px solid currentColor; color:inherit; border-radius:6px; padding:4px 10px; font-size:12px; font-weight:600; cursor:pointer; margin-left:6px;}

  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .section-head-sticky{position:sticky; top:var(--sticky-offset,80px); z-index:15; background:var(--bg-panel-raised); margin:-26px -26px 18px -26px; padding:18px 26px 14px 26px; border-bottom:1px solid var(--line);}
  .filterbar{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-top:12px;}
  .filterbar .field-input, .filterbar .field-select{width:auto; min-width:160px; padding:8px 12px; font-size:13px;}
  .filterbar-icon{color:var(--text-low); display:flex; align-items:center;}
  .filterbar-icon svg{width:15px; height:15px;}
  .filter-clear{background:none; border:1px solid var(--line); color:var(--text-mid); border-radius:7px; padding:7px 11px; font-size:12.5px; cursor:pointer; display:flex; align-items:center; gap:5px;}
  .filter-clear:hover{color:var(--text-hi); border-color:var(--text-low);}
  .filter-clear svg{width:12px; height:12px;}
  .section-title{font-family:'Oswald',sans-serif; font-size:19px; text-transform:uppercase; letter-spacing:0.05em; font-weight:600; display:flex; align-items:center; gap:10px;}
  .section-title svg{width:20px; height:20px; flex-shrink:0;}
  .section-title .tag{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-mid); background:var(--bg-panel); padding:3px 9px; border-radius:6px; border:1px solid var(--line); text-transform:none; letter-spacing:0;}
  .section-desc{font-size:12.5px; color:var(--text-mid); margin:-10px 0 18px 0; line-height:1.6;}

  .btn{font-family:'Inter',sans-serif; font-weight:600; font-size:13.5px; border:none; border-radius:8px; padding:10px 16px; cursor:pointer; display:flex; align-items:center; gap:7px; transition:all .15s ease;}
  .btn svg{width:15px; height:15px;}
  .btn-primary{background:var(--accent-amber); color:#1a1200;}
  .btn-primary:hover{background:#ffb347; transform:translateY(-1px);}
  .btn-ghost{background:var(--bg-panel); color:var(--text-mid); border:1px solid var(--line);}
  .btn-ghost:hover{color:var(--text-hi); border-color:var(--text-low);}
  .btn-danger{background:var(--accent-red-dim); color:#ff8fa3;}
  .btn-danger:hover{background:#5c2536;}
  .btn-sm{padding:7px 10px; font-size:12px;}
  .icon-btn{background:var(--bg-panel); border:1px solid var(--line); color:var(--text-mid); width:32px; height:32px; border-radius:7px; display:flex; align-items:center; justify-content:center; cursor:pointer; transition:all .15s ease;}
  .icon-btn svg{width:15px; height:15px;}
  .icon-btn:hover{color:var(--text-hi); border-color:var(--text-low);}
  .icon-btn.danger:hover{color:#ff8fa3; border-color:var(--accent-red);}

  .tablewrap{border:1px solid var(--line); border-radius:10px; overflow-x:auto;}
  table{width:100%; border-collapse:collapse; min-width:760px;}
  thead th{text-align:left; font-family:'Oswald',sans-serif; font-size:11.5px; letter-spacing:0.09em; text-transform:uppercase; color:var(--text-mid); background:var(--bg-panel); padding:12px 16px; border-bottom:1px solid var(--line); font-weight:500;}
  tbody td{padding:14px 16px; border-bottom:1px solid var(--line-soft); font-size:14.5px; vertical-align:middle;}
  tbody tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .12s ease;}
  tbody tr:hover{background:rgba(255,255,255,0.02);}
  tbody tr:nth-child(even){background:rgba(255,255,255,0.012);}
  .cell-mono{font-family:'JetBrains Mono',monospace; font-size:13.5px; color:var(--text-mid);}
  .cell-strong{font-weight:600; color:var(--text-hi);}
  .cell-sub{font-size:12px; color:var(--text-low); margin-top:2px;}
  .row-actions{display:flex; gap:6px; justify-content:flex-end;}

  .empty-state{padding:60px 20px; text-align:center; color:var(--text-low);}
  .empty-state svg{width:46px; height:46px; margin-bottom:12px; opacity:0.5;}
  .empty-state p{font-size:14px; margin-bottom:14px;}

  .vchip{display:flex; align-items:center; gap:9px;}
  .vchip .vicon{width:34px; height:26px; display:flex; align-items:center; justify-content:center; background:var(--bg-panel); border:1px solid var(--line); border-radius:6px; flex-shrink:0;}
  .vchip .vicon svg{width:22px; height:18px;}
  .vlabel{font-size:12px; color:var(--text-mid);}

  .badge{display:inline-flex; align-items:center; gap:6px; font-family:'JetBrains Mono',monospace; font-size:11.5px; font-weight:600; padding:5px 10px; border-radius:20px; letter-spacing:0.03em; text-transform:uppercase; border:none; cursor:default;}
  .badge .bdot{width:6px; height:6px; border-radius:50%; flex-shrink:0;}
  .badge-teal{background:var(--accent-teal-dim); color:var(--accent-teal);}
  .badge-teal .bdot{background:var(--accent-teal);}
  .badge-amber{background:var(--accent-amber-dim); color:var(--accent-amber);}
  .badge-amber .bdot{background:var(--accent-amber);}
  .badge-red{background:var(--accent-red-dim); color:#ff8fa3;}
  .badge-red .bdot{background:var(--accent-red);}
  .badge-violet{background:var(--accent-violet-dim); color:var(--accent-violet);}
  .badge-violet .bdot{background:var(--accent-violet);}
  .badge-gray{background:var(--bg-panel); color:var(--text-low); border:1px solid var(--line);}
  .badge-gray .bdot{background:var(--text-low);}
  .badge-btn{cursor:pointer; transition:all .15s ease;}
  .badge-btn:hover{filter:brightness(1.25); transform:translateY(-1px);}

  .split2{display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:22px;}
  @media (max-width:900px){.split2{grid-template-columns:1fr;}}

  .settings-grid{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
  @media (max-width:900px){.settings-grid{grid-template-columns:1fr;}}
  .field-group{margin-bottom:16px;}
  .field-label{font-size:12px; color:var(--text-mid); margin-bottom:7px; display:block; font-weight:600; letter-spacing:0.03em; text-transform:uppercase; font-family:'Oswald',sans-serif;}
  .field-input, .field-select, .field-textarea{width:100%; background:var(--bg-panel); border:1px solid var(--line); color:var(--text-hi); padding:11px 13px; border-radius:8px; font-family:'Inter',sans-serif; font-size:14px; outline:none; transition:border-color .15s ease;}
  .field-input:focus, .field-select:focus, .field-textarea:focus{border-color:var(--accent-amber);}
  .field-textarea{resize:vertical; min-height:70px;}
  .field-hint{font-size:12px; color:var(--text-low); margin-top:6px;}
  .card{background:var(--bg-panel); border:1px solid var(--line); border-radius:10px; padding:20px;}
  .card + .card{margin-top:16px;}
  .config-subnav{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px;}
  .config-subtab{display:flex; align-items:center; gap:7px; background:var(--bg-panel); border:1px solid var(--line); color:var(--text-mid); padding:9px 14px; border-radius:8px; font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; cursor:pointer; transition:all .15s ease;}
  .config-subtab svg{width:14px; height:14px; flex-shrink:0;}
  .config-subtab:hover{color:var(--text-hi); border-color:var(--text-low);}
  .config-subtab.active{background:var(--accent-amber-dim); border-color:var(--accent-amber); color:var(--accent-amber);}
  .card-title{font-family:'Oswald',sans-serif; text-transform:uppercase; font-size:14px; letter-spacing:0.05em; margin-bottom:6px; color:var(--text-mid); font-weight:600; display:flex; align-items:center; gap:8px;}
  .card-title svg{width:15px; height:15px; flex-shrink:0;}
  .card-desc{font-size:12.5px; color:var(--text-low); margin-bottom:16px; line-height:1.6;}

  .swatchrow{display:flex; gap:10px; flex-wrap:wrap;}
  .swatch{width:34px; height:34px; border-radius:8px; cursor:pointer; border:2px solid transparent; transition:all .15s ease; position:relative;}
  .swatch.selected{border-color:var(--text-hi);}
  .swatch.selected::after{content:'✓'; position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#000; font-weight:700; font-size:14px;}

  .avisos-list .aviso-item{display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--line); border-radius:9px; margin-bottom:10px; background:var(--bg-panel);}
  .aviso-swatch{width:10px; height:36px; border-radius:4px; flex-shrink:0;}
  .aviso-item .ai-body{flex:1; min-width:0;}
  .aviso-item .ai-title{font-weight:600; font-size:14px; margin-bottom:2px;}
  .aviso-item .ai-msg{font-size:12.5px; color:var(--text-mid); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .aviso-thumb{width:44px; height:44px; border-radius:7px; object-fit:cover; flex-shrink:0; border:1px solid var(--line); background:var(--bg-panel-raised);}
  .colab-avatar{width:36px; height:36px; border-radius:50%; object-fit:cover; display:block; border:1px solid var(--line);}
  .colab-avatar-empty{display:flex; align-items:center; justify-content:center; background:var(--bg-panel-raised-2); color:var(--text-mid); font-weight:700; font-size:14px;}

  .imgup{border:1.5px dashed var(--line); border-radius:10px; padding:16px; text-align:center; cursor:pointer; transition:all .15s ease; background:var(--bg-panel);}
  .imgup:hover{border-color:var(--accent-amber); background:var(--bg-panel-raised);}
  .imgup svg{width:22px; height:22px; color:var(--text-mid); margin-bottom:6px;}
  .imgup p{font-size:12.5px; color:var(--text-mid);}
  .imgup input[type=file]{display:none;}
  .imgpreview-wrap{position:relative; display:inline-block; max-width:100%;}
  .imgpreview-wrap img, .imgpreview-wrap video{max-width:100%; max-height:220px; border-radius:10px; border:1px solid var(--line); display:block;}
  .imgpreview-remove{position:absolute; top:8px; right:8px; background:rgba(14,17,22,0.85); border:1px solid var(--line); color:var(--text-hi); width:28px; height:28px; border-radius:7px; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .imgpreview-remove svg{width:14px; height:14px;}
  .banco-del svg{width:11px; height:11px;}
  .imgpreview-remove:hover{color:#ff8fa3; border-color:var(--accent-red);}

  /* ---- Layout drag list ---- */
  .layout-list{display:flex; flex-direction:column; gap:8px;}
  .layout-item{display:flex; align-items:center; gap:12px; background:var(--bg-panel); border:1px solid var(--line); border-radius:9px; padding:10px 12px; cursor:grab;}
  .layout-item.dragging{opacity:0.4;}
  .layout-item.drag-over{border-color:var(--accent-amber);}
  .layout-handle{color:var(--text-low); display:flex; align-items:center; cursor:grab; flex-shrink:0;}
  .layout-handle svg{width:16px; height:16px;}
  .layout-pos{font-family:'JetBrains Mono',monospace; font-size:12px; color:var(--text-low); width:20px; flex-shrink:0;}
  .layout-icon{width:30px; height:30px; border-radius:7px; background:var(--bg-panel-raised); display:flex; align-items:center; justify-content:center; flex-shrink:0; color:var(--text-mid);}
  .layout-icon svg{width:15px; height:15px;}
  .layout-swatch{width:12px; height:12px; border-radius:4px; flex-shrink:0;}
  .layout-label{flex:1; min-width:0; font-size:13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .layout-controls{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .layout-dur{width:64px; background:var(--bg-panel-raised); border:1px solid var(--line); color:var(--text-hi); font-family:'JetBrains Mono',monospace; font-size:12px; padding:6px 7px; border-radius:6px; text-align:center;}
  .layout-toggle{width:38px; height:22px; border-radius:20px; background:var(--bg-panel-raised); border:1px solid var(--line); position:relative; cursor:pointer; flex-shrink:0; transition:all .15s ease;}
  .layout-toggle::after{content:''; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:var(--text-low); transition:all .15s ease;}
  .layout-toggle.on{background:var(--accent-teal-dim); border-color:var(--accent-teal);}
  .layout-toggle.on::after{left:18px; background:var(--accent-teal);}
  .layout-updown{display:flex; flex-direction:column; gap:2px;}
  .layout-updown button{background:none; border:none; color:var(--text-low); cursor:pointer; padding:1px; display:flex;}
  .layout-updown button:hover{color:var(--text-hi);}
  .layout-updown svg{width:13px; height:13px;}

  /* ================= MODAL ================= */
  .modal-overlay{position:fixed; inset:0; background:rgba(6,8,11,0.72); backdrop-filter:blur(3px); display:flex; align-items:center; justify-content:center; z-index:250; padding:20px; animation:fadeIn .15s ease;}
  @keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
  .modal{background:var(--bg-panel-raised); border:1px solid var(--line); border-radius:14px; width:100%; max-width:540px; max-height:88vh; overflow-y:auto; box-shadow:0 30px 60px -20px rgba(0,0,0,0.6); animation:slideUp .18s ease;}
  @keyframes slideUp{from{transform:translateY(14px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .modal-head{display:flex; align-items:center; justify-content:space-between; padding:20px 22px; border-bottom:1px solid var(--line);}
  .modal-head h3{font-family:'Oswald',sans-serif; text-transform:uppercase; letter-spacing:0.04em; font-size:17px; font-weight:600;}
  .modal-body{padding:22px;}
  .modal-foot{display:flex; justify-content:flex-end; gap:10px; padding:16px 22px; border-top:1px solid var(--line);}
  .modal-close{background:none; border:none; color:var(--text-mid); cursor:pointer; width:30px; height:30px; display:flex; align-items:center; justify-content:center; border-radius:7px;}
  .modal-close:hover{background:var(--bg-panel); color:var(--text-hi);}
  .modal-close svg{width:16px; height:16px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px;}
  .vpick{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .vpick label{cursor:pointer;}
  .vpick input{display:none;}
  .vpick .vopt{border:1px solid var(--line); background:var(--bg-panel); border-radius:9px; padding:10px 6px; display:flex; flex-direction:column; align-items:center; gap:6px; transition:all .15s ease;}
  .vpick .vopt svg{width:26px; height:20px;}
  .vpick .vopt span{font-size:10px; color:var(--text-mid); text-transform:uppercase; letter-spacing:0.02em; font-family:'Oswald',sans-serif; text-align:center;}
  .vpick input:checked + .vopt{border-color:var(--accent-amber); background:var(--accent-amber-dim);}
  .vpick input:checked + .vopt span{color:var(--accent-amber);}

  /* ================= TV MODE ================= */
  .tv-root{position:fixed; inset:0; background:var(--bg-void); z-index:200; display:none; flex-direction:column;}
  .tv-root.active{display:flex;}
  /* O ponto de acesso à edição fica sempre visível (mesmo discreto) — não há mais link separado só-TV. */
  .tv-header{display:flex; align-items:flex-start; justify-content:space-between; padding:30px 54px 16px 54px; gap:20px;}
  .tv-brand{display:flex; align-items:center; gap:20px; min-width:0;}
  .tv-mark{width:60px; height:60px; border-radius:14px; background:linear-gradient(135deg, var(--accent-amber), #12608A); display:flex; align-items:center; justify-content:center; box-shadow:0 0 0 1px rgba(41,169,224,0.35), 0 10px 30px -8px rgba(41,169,224,0.6); flex-shrink:0;}
  .tv-mark svg{width:32px; height:32px;}
  .tv-title{font-family:'Oswald',sans-serif; font-size:34px; font-weight:600; letter-spacing:0.04em; text-transform:uppercase; line-height:1;}
  .tv-sub{font-size:15px; color:var(--text-mid); margin-top:6px; letter-spacing:0.02em;}
  .tv-right{display:flex; flex-direction:column; align-items:flex-end; gap:10px; flex-shrink:0;}
  .tv-clock{font-family:'JetBrains Mono',monospace; font-size:44px; font-weight:600; text-align:right; line-height:1;}
  .tv-date{font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--text-mid); text-align:right; text-transform:capitalize;}
  .tv-toolbar{display:flex; align-items:center; gap:8px;}
  .tv-filter{display:flex; align-items:center; gap:7px; background:var(--bg-panel); border:1px solid var(--line); padding:6px 10px; border-radius:8px;}
  .tv-filter svg{width:13px; height:13px; color:var(--text-mid); flex-shrink:0;}
  .tv-filter select{background:transparent; border:none; color:var(--text-hi); font-family:'JetBrains Mono',monospace; font-size:12px; outline:none; cursor:pointer;}
  .tv-filter select option{background:var(--bg-panel-raised);}
  .tv-unlock-dot{width:10px; height:10px; border-radius:50%; background:var(--text-low); opacity:0.22; border:none; cursor:pointer; padding:0; transition:opacity .2s, transform .2s;}
  .tv-unlock-dot:hover{opacity:0.75; transform:scale(1.3);}

  .tv-progress{height:4px; background:var(--bg-panel); margin:0 54px; border-radius:3px; overflow:hidden;}
  .tv-road-strip{position:relative; height:26px; overflow:hidden; background:linear-gradient(180deg, var(--bg-panel), var(--bg-void)); border-bottom:1px solid var(--line);}
  .tv-road-lines{position:absolute; left:0; right:0; top:50%; height:3px; margin-top:-1.5px; background-image:repeating-linear-gradient(90deg, var(--text-low) 0 24px, transparent 24px 46px); opacity:0.55; animation:tvRoadMove 1.6s linear infinite;}
  .tv-road-vehicle{position:absolute; bottom:2px; left:-70px; width:52px; height:22px; color:var(--accent-amber); animation:tvDriveAcross 16s linear infinite; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.4));}
  .tv-road-vehicle svg{width:100%; height:100%;}
  @keyframes tvRoadMove{ from{background-position-x:0;} to{background-position-x:-46px;} }
  @keyframes tvDriveAcross{ 0%{left:-70px;} 100%{left:100%;} }
  .tv-progress-bar{height:100%; background:linear-gradient(90deg, var(--accent-amber), var(--accent-teal)); width:0%; transition:width linear;}
  .tv-body{flex:1; padding:0; overflow:hidden; position:relative;}
  .tv-slide{position:absolute; inset:24px 54px 20px 54px; opacity:0; transform:translateX(24px); transition:opacity .5s ease, transform .5s ease; pointer-events:none; overflow:hidden;}
  .tv-slide.showing{opacity:1; transform:translateX(0); pointer-events:auto;}
  .tv-scroll{height:100%; overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none;}
  .tv-scroll::-webkit-scrollbar{display:none;}
  .tv-slide-title{font-family:'Oswald',sans-serif; font-size:26px; text-transform:uppercase; letter-spacing:0.05em; font-weight:600; margin-bottom:20px; display:flex; align-items:center; gap:14px; color:var(--accent-amber);}
  .tv-slide-title svg{width:26px; height:26px;}
  .tv-table{width:100%; border-collapse:collapse;}
  .tv-table thead th{text-align:left; font-family:'Oswald',sans-serif; font-size:14px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text-mid); padding:11px 16px; border-bottom:2px solid var(--line); font-weight:500;}
  .tv-table tbody td{padding:15px 16px; font-size:19px; border-bottom:1px solid var(--line-soft);}
  .tv-table tbody tr:nth-child(even){background:rgba(255,255,255,0.015);}
  .tv-table .cell-mono{font-family:'JetBrains Mono',monospace; color:var(--text-mid); font-size:17px;}
  .tv-table .cell-strong{font-weight:700;}
  .tv-vchip{display:flex; align-items:center; gap:12px;}
  .tv-vchip .vicon{width:48px; height:34px; display:flex; align-items:center; justify-content:center; background:var(--bg-panel); border:1px solid var(--line); border-radius:8px;}
  .tv-vchip .vicon svg{width:30px; height:22px;}
  .tv-badge{font-family:'JetBrains Mono',monospace; font-size:14px; font-weight:700; padding:6px 13px; border-radius:20px; letter-spacing:0.03em; text-transform:uppercase; display:inline-flex; align-items:center; gap:8px; border:none;}
  .tv-badge.clickable{cursor:pointer;}
  .tv-badge .bdot{width:8px; height:8px; border-radius:50%;}
  .tv-dots{display:flex; align-items:center; justify-content:center; gap:9px; padding:14px 0 22px 0;}
  .tv-dot{width:9px; height:9px; border-radius:50%; background:var(--line); cursor:pointer; transition:all .2s ease;}
  .tv-dot.active{background:var(--accent-amber); width:26px; border-radius:6px;}
  .tv-empty{color:var(--text-low); font-size:20px; padding:40px; text-align:center;}
  .tv-general-grid{display:grid; grid-template-columns:1fr 1fr; gap:30px; height:100%;}
  .tv-general-col{display:flex; flex-direction:column; min-height:0;}
  .tv-general-col .tv-table-wrap{flex:1; overflow:hidden; border:1px solid var(--line); border-radius:12px;}
  .tv-aviso{height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; border-radius:16px; padding:60px;}
  .tv-aviso-title{font-family:'Oswald',sans-serif; font-size:52px; text-transform:uppercase; letter-spacing:0.03em; font-weight:700; margin-bottom:22px;}
  .tv-aviso-msg{font-size:24px; color:var(--text-mid); max-width:900px; line-height:1.5;}
  .tv-aviso-img{max-width:min(60%,620px); max-height:38vh; object-fit:contain; border-radius:14px; margin-bottom:28px; box-shadow:0 20px 50px -12px rgba(0,0,0,0.5); border:1px solid var(--line);}
  .tv-lunch-pill{font-family:'JetBrains Mono',monospace; background:var(--bg-panel); border:1px solid var(--line); padding:5px 11px; border-radius:20px; font-size:15px; color:var(--text-hi);}
  .tv-colab-avatar{width:40px; height:40px; border-radius:50%; object-fit:cover; display:block; border:1px solid var(--line);}
  .tv-colab-avatar-empty{display:flex; align-items:center; justify-content:center; background:var(--bg-panel-raised-2); color:var(--text-mid); font-weight:700; font-size:15px;}
  .tv-obs{font-size:14px; color:var(--text-low); font-style:italic;}
  @media (max-width:1000px){ .tv-general-grid{grid-template-columns:1fr;} .tv-title{font-size:24px;} .tv-clock{font-size:32px;} }

  /* ================= MOBILE (celular) ================= */
  @media (max-width:640px){
    /* Cabeçalho do painel de edição */
    .topbar{padding:12px 14px; flex-direction:column; align-items:stretch; gap:10px;}
    .brand{gap:10px;}
    .brand-mark{width:34px; height:34px; border-radius:8px;}
    .brand-mark svg{width:18px; height:18px;}
    .brand-title{font-size:15px; letter-spacing:0.03em;}
    .brand-sub{font-size:10.5px;}
    .clockwrap{width:100%; justify-content:space-between; gap:10px;}
    .clock{font-size:19px;}
    .datebox{font-size:9.5px;}
    .live-dot{font-size:9.5px;}
    .mode-toggle{margin-left:0; width:100%; justify-content:center;}
    .mode-btn{flex:1; justify-content:center; padding:9px 8px; font-size:10.5px;}
    .tabbar{padding:12px 12px 0 12px; gap:4px;}
    .tabbtn{padding:9px 12px; font-size:12px;}
    .content-area{margin:0 12px 16px 12px; padding:16px; border-radius:10px;}
    .section-head{flex-wrap:wrap; gap:10px;}
    .section-head-sticky{margin:-16px -16px 14px -16px; padding:14px 16px 12px 16px;}
    .filterbar{gap:8px;}
    .filterbar .field-input, .filterbar .field-select{min-width:130px; flex:1;}
    .settings-grid{gap:12px;}

    /* Formulários e modais */
    .modal-overlay{padding:10px;}
    .modal-body{padding:16px;}
    .row2, .row3{grid-template-columns:1fr;}
    .vpick{grid-template-columns:repeat(2,1fr);}

    /* Modo TV — reduz tudo proporcionalmente para caber na tela do celular */
    .tv-header{padding:16px 16px 10px 16px; gap:10px; flex-wrap:wrap;}
    .tv-mark{width:38px; height:38px; border-radius:9px;}
    .tv-mark svg{width:20px; height:20px;}
    .tv-title{font-size:16px;}
    .tv-sub{font-size:10.5px; margin-top:3px;}
    .tv-right{align-items:flex-start; gap:6px;}
    .tv-clock{font-size:22px;}
    .tv-date{font-size:10px;}
    .tv-toolbar{flex-wrap:wrap;}
    .tv-filter{padding:5px 8px;}
    .tv-filter select{font-size:10.5px;}
    .tv-unlock-dot{width:14px; height:14px;}
    .tv-progress{margin:0 16px;}
    .tv-slide{inset:14px 16px 12px 16px;}
    .tv-slide-title{font-size:16px; gap:8px; margin-bottom:12px;}
    .tv-slide-title svg{width:18px; height:18px;}
    .tv-table thead th{font-size:10px; padding:8px 8px;}
    .tv-table tbody td{padding:9px 8px; font-size:12px;}
    .tv-table .cell-mono{font-size:11px;}
    .tv-vchip .vicon{width:32px; height:24px;}
    .tv-vchip .vicon svg{width:20px; height:16px;}
    .tv-badge{font-size:10px; padding:4px 9px;}
    .tv-lunch-pill{font-size:11px; padding:3px 8px;}
    .tv-obs{font-size:11px;}
    .tv-empty{font-size:14px; padding:24px;}
    .tv-aviso{padding:24px;}
    .tv-aviso-title{font-size:24px; margin-bottom:12px;}
    .tv-aviso-msg{font-size:14px;}
    .tv-aviso-img{max-height:26vh; margin-bottom:16px;}
    .clock-header{font-size:22px;}
  }

  .toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--bg-panel-raised-2); border:1px solid var(--line); color:var(--text-hi); padding:12px 20px; border-radius:10px; font-size:13.5px; font-weight:500; z-index:300; opacity:0; transition:all .25s ease; display:flex; align-items:center; gap:10px; box-shadow:0 10px 30px -8px rgba(0,0,0,0.5);}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast svg{width:16px; height:16px; color:var(--accent-teal); flex-shrink:0;}
  .footer-note{padding:14px 28px 30px 28px; color:var(--text-low); font-size:12px; text-align:center;}
</style>

/* Escala de revezamento dos turnistas — regra extraída da planilha oficial
   (validada contra 3018 dias, de 2024 a 2032, sem exceções).
   A cada 2 dias o ciclo avança para o próximo estado, num ciclo de 4 estados:
   cada estado define [turma do dia, turma da noite, turma de folga, turma de folga]. */
const TURNO_ANCHOR = new Date(2024,0,1);
const TURNO_ESTADOS = [['A','C','B','D'], ['B','A','C','D'], ['D','B','C','A'], ['C','D','B','A']];
function turnoDoDia(date){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
  const diffDays = Math.round((d - TURNO_ANCHOR) / 86400000);
  const idx = (((Math.floor((diffDays+1)/2)) % 4) + 4) % 4;
  return TURNO_ESTADOS[idx]; // [turmaDia, turmaNoite, turmaFolga1, turmaFolga2]
}

function loadState(){
  // Mostra o painel imediatamente com dados padrão, sem depender da nuvem.
  syncLayoutWithAvisos();
  renderAll();
  enterTvMode(); // por padrão, o link sempre abre no Modo TV
  if(!firebaseReady){
    setOfflineBanner(true, 'Sem conexão com a nuvem — o que você fizer agora fica só neste dispositivo e some se você sair sem corrigir isso. Veja o guia de configuração do Firebase.');
    return;
  }
  painelDocRef.onSnapshot(snap=>{
    if(snap.exists){
      const data = snap.data();
      const incoming = JSON.stringify(data);
      if(incoming !== JSON.stringify(state)){
        isRemoteUpdate = true;
        applyRemoteState(data);
        isRemoteUpdate = false;
      } else {
        lastKnownRev = data._rev || 0;
      }
      setOfflineBanner(false);
    } else {
      // Primeira vez que o painel roda: cria o documento no Firestore com os dados padrão.
      const initial = {...state, _rev: 1};
      painelDocRef.set(initial).then(()=>{ lastKnownRev = 1; setOfflineBanner(false); }).catch(()=>{ toast('Erro ao criar o painel no banco de dados', ICONS.x); setOfflineBanner(true, 'Não foi possível criar o painel no banco de dados. Suas alterações estão sendo guardadas só neste dispositivo.'); });
    }
  }, err=>{
    console.error(err);
    setOfflineBanner(true, 'Erro de conexão com o banco de dados — verifique sua internet. Suas alterações estão sendo guardadas só neste dispositivo enquanto isso.');
  });
}

let saveTimer = null;
function saveState(showToast){
  if(isRemoteUpdate) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    if(!firebaseReady){
      if(showToast) toast('Salvo só neste dispositivo (Firebase não configurado)', ICONS.x);
      setOfflineBanner(true, 'Sem conexão com a nuvem — o que você fizer agora fica só neste dispositivo e some se você sair sem corrigir isso. Veja o guia de configuração do Firebase.');
      return;
    }
    const payload = {...state, _rev: (lastKnownRev||0) + 1};
    db.runTransaction(async (tx)=>{
      const snap = await tx.get(painelDocRef);
      const cloudRev = snap.exists ? (snap.data()._rev || 0) : 0;
      if(cloudRev !== lastKnownRev) throw new Error('CONFLITO_VERSAO');
      tx.set(painelDocRef, payload);
    }).then(()=>{
      lastKnownRev = payload._rev;
      saveLocalBackup();
      setOfflineBanner(false);
      if(showToast) toast('Alterações salvas', ICONS.check);
    }).catch(err=>{
      if(err && err.message==='CONFLITO_VERSAO'){ showSyncConflictWarning(); }
      else{ toast('Erro ao salvar — verifique sua internet', ICONS.x); setOfflineBanner(true, 'Erro ao salvar na nuvem — suas últimas alterações podem não ter sido sincronizadas. Verifique sua internet.'); }
    });
  }, 250);
}

function isoWeekNumber(date){
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));

  d.setUTCDate(d.getUTCDate() + 4 - dayNum);
  const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
  return Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
}

function isWithinLunch(str){
  if(!str) return false;
  const m = str.match(/(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})/);
  if(!m) return false;
  const now = new Date();
  const cur = now.getHours()*60+now.getMinutes();
  const start = parseInt(m[1],10)*60+parseInt(m[2],10);
  const end = parseInt(m[3],10)*60+parseInt(m[4],10);
  if(start<=end) return cur>=start && cur<end;
  return cur>=start || cur<end;
}
function isAfterTime(h,m){
  const now = new Date();
  return (now.getHours()*60+now.getMinutes()) >= (h*60+m);
}
function turnistaTurma(c){

  return a ? a.replace('Turnista Turma ','').trim() : '';
}
function isTurnista(c){ return !!turnistaTurma(c); }
/* Diz se a turma (letra) está em horário ativo agora — considera o turno da
   noite que começou ontem (ainda em curso até 07:00) e o turno de hoje. */
function turmaEstaAtiva(letra){
  const now = new Date();
  const hm = now.getHours()*60+now.getMinutes();
  const hoje = turnoDoDia(now);
  if(letra===hoje[0] && hm>=7*60 && hm<19*60) return true; // turno do dia: 07:00–19:00
  if(letra===hoje[1] && hm>=19*60) return true; // turno da noite iniciado hoje
  const ontem = new Date(now); ontem.setDate(ontem.getDate()-1);
  const turnoOntem = turnoDoDia(ontem);
  if(letra===turnoOntem[1] && hm<7*60) return true; // turno da noite iniciado ontem, ainda em curso
  return false;
}
function alocacaoLabel(c){
  const parts = (c.alocacoes||[]).slice();
  if(c.alocacaoObs) parts.push(c.alocacaoObs);
  return parts.join(', ') || '—';
}

/* Turno Administrativo (todo mundo que não é Turnista): presente automaticamente
   de segunda a sexta, das 07:40 às 16:30. Fora disso, folga. */
function dentroHorarioAdministrativo(){
  const now = new Date();
  const dia = now.getDay(); // 0=domingo ... 6=sábado
  if(dia===0 || dia===6) return false;
  const hm = now.getHours()*60+now.getMinutes();
  return hm >= (7*60+40) && hm < (16*60+30);

function colabDisplayStatus(c){
  const af = afastamentoAtivo(c);
  if(af) return af.tipo;
  const letra = turnistaTurma(c);
  if(letra){
    if(!turmaEstaAtiva(letra)) return 'folga';
    return isWithinLunch(c.almoco) ? 'almoco' : 'presente';
  }
  if(!dentroHorarioAdministrativo()) return 'folga';
  if(isWithinLunch(c.almoco)) return 'almoco';
  return 'presente';
}

function renderContent(){
  const area = document.getElementById('contentArea');
  if(activeTab==='agendamentos') area.innerHTML = tplAgendamentos();
  else if(activeTab==='colaboradores') area.innerHTML = tplColaboradores();
  else if(activeTab==='geral') area.innerHTML = tplGeral();
  else if(activeTab==='avisos') area.innerHTML = tplAvisosTab();
  else if(activeTab==='config') area.innerHTML = tplConfig();
  bindContentEvents();
  if(activeTab==='config'){
    bindLayoutEvents(); bindBancoEvents();
    area.querySelectorAll('.config-subtab').forEach(btn=>{
      btn.addEventListener('click', ()=>{ configSubTab = btn.dataset.subtab; renderContent(); });
    });
    const restoreBtn = area.querySelector('#btnRestoreBackup');
    if(restoreBtn){ restoreBtn.addEventListener('click', ()=>{
      if(!confirm('Isso vai substituir os dados atuais pelos da última cópia de segurança salva neste navegador. Deseja continuar?')) return;
      try{
        const raw = localStorage.getItem('painel_backup_v1');
        if(!raw){ toast('Nenhuma cópia local encontrada', ICONS.x); return; }
        const backup = JSON.parse(raw);
        state = backup.state;
        lastKnownRev = (lastKnownRev||0) + 1;
        syncLayoutWithAvisos();
        afterMutate();
        toast('Cópia local restaurada e enviada para a nuvem', ICONS.check);
      }catch(e){ toast('Não foi possível restaurar a cópia local', ICONS.x); }
    }); }
    const btnEmail = area.querySelector('#btnEnviarEmailTodos');
    if(btnEmail){ btnEmail.addEventListener('click', ()=>{
      const emails = state.colaboradores.filter(c=>c.email).map(c=>c.email);
      if(emails.length===0){ toast('Nenhum colaborador com e-mail cadastrado', ICONS.x); return; }
      const subject = encodeURIComponent(`Agendamentos do dia — ${state.config.titulo||'Painel Gestão à Vista'}`);
      const bodyMail = encodeURIComponent(resumoAgendamentosTexto());
      window.location.href = `mailto:?bcc=${emails.join(',')}&subject=${subject}&body=${bodyMail}`;
    }); }
    area.querySelectorAll('.btnEnviarWhats').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const texto = encodeURIComponent(resumoAgendamentosTexto());
        window.open(`https://wa.me/${btn.dataset.tel}?text=${texto}`, '_blank');
      });
    });
    const btnSair = area.querySelector('#btnSairConta');
    if(btnSair){ btnSair.addEventListener('click', ()=>{
      if(!confirm('Sair da conta de edição e voltar para o Modo TV?')) return;
      if(auth) auth.signOut();
      enterTvMode();
    }); }
  }
  if(activeTab==='agendamentos' || activeTab==='colaboradores'){ bindFilterEvents(); }
}

/* Lê um arquivo de imagem, redimensiona/comprime e devolve um data URL (base64).
   Isso mantém o tamanho salvo pequeno o suficiente para bancos como Firestore/Supabase. */
function readImageAsCompressedDataURL(file, maxDim=1400, quality=0.78){
  return new Promise((resolve, reject)=>{
    if(!file || !file.type || !file.type.startsWith('image/')){ reject(new Error('Arquivo não é uma imagem')); return; }
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Falha ao ler o arquivo'));
    reader.onload = ()=>{
      const img = new Image();
      img.onerror = ()=> reject(new Error('Falha ao carregar a imagem'));
      img.onload = ()=>{
        let {width, height} = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function bindContentEvents(){

function rerenderPreservingFocus(){
  const active = document.activeElement;
  const id = active && active.id;
  const selStart = (active && typeof active.selectionStart === 'number') ? active.selectionStart : null;
  const selEnd = (active && typeof active.selectionEnd === 'number') ? active.selectionEnd : null;
  renderContent();
  if(id){
    const el = document.getElementById(id);
    if(el){
      el.focus();
      if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
    }
  }
}

function addBancoItem(tipo, valorBruto){
  const valor = (valorBruto||'').trim();
  if(!valor) return false;
  state.config.bancos = state.config.bancos || {transportadores:[],motoristas:[],cargas:[]};
  const lista = state.config.bancos[tipo] = state.config.bancos[tipo] || [];
  const existe = lista.some(v=> v.toLowerCase()===valor.toLowerCase());
  if(!existe){ lista.push(valor); return true; }
  return false;
}
function bindBancoEvents(){
  const area = document.getElementById('contentArea');
  area.querySelectorAll('.banco-add').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const tipo = btn.dataset.tipo;
      const input = area.querySelector(`.banco-input[data-tipo="${tipo}"]`);
      if(addBancoItem(tipo, input.value)){ afterMutate(); activeTab='config'; renderTabbar(); renderContent(); }
      else if(input.value.trim()){ toast('Esse item já está na lista', ICONS.x); }
    });
  });
  area.querySelectorAll('.banco-input').forEach(inp=>{
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); area.querySelector(`.banco-add[data-tipo="${inp.dataset.tipo}"]`).click(); }
    });
  });
  area.querySelectorAll('.banco-del').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const {tipo, valor} = btn.dataset;
      state.config.bancos[tipo] = (state.config.bancos[tipo]||[]).filter(v=>v!==valor);
      afterMutate(); activeTab='config'; renderTabbar(); renderContent();
    });
  });
  const afAdd = area.querySelector('#afAdd');
  if(afAdd){
    afAdd.addEventListener('click', ()=>{
      const colaboradorId = area.querySelector('#afColaborador').value;
      const tipo = area.querySelector('#afTipo').value;
      const inicio = area.querySelector('#afInicio').value;
      const fim = area.querySelector('#afFim').value;
      const obs = area.querySelector('#afObs').value.trim();
      if(!colaboradorId){ toast('Cadastre um colaborador primeiro', ICONS.x); return; }
      if(!inicio){ toast('Informe a data de início', ICONS.x); return; }
      if(fim && fim<inicio){ toast('A data de fim não pode ser antes do início', ICONS.x); return; }
      state.afastamentos = state.afastamentos || [];
      state.afastamentos.push({id:uid(), colaboradorId, tipo, inicio, fim: fim||null, obs});
      afterMutate(); activeTab='config'; renderTabbar(); renderContent();
      toast('Afastamento adicionado', ICONS.check);
    });
  }
}
function handleAction(action, id){
  switch(action){
    case 'add-agendamento': openAgendamentoModal(); break;
    case 'edit-agendamento': openAgendamentoModal(state.agendamentos.find(x=>x.id===id)); break;
    case 'del-agendamento': confirmDelete(()=>{ state.agendamentos = state.agendamentos.filter(x=>x.id!==id); afterMutate(); }); break;
    case 'toggle-status-agendamento': { const it=state.agendamentos.find(x=>x.id===id); if(it){ it.status = AG_STATUS_ORDER[(AG_STATUS_ORDER.indexOf(it.status)+1)%AG_STATUS_ORDER.length]; afterMutate(); } break; }

    case 'add-colaborador': openColaboradorModal(); break;
    case 'edit-colaborador': openColaboradorModal(state.colaboradores.find(x=>x.id===id)); break;
    case 'del-colaborador': confirmDelete(()=>{ state.colaboradores = state.colaboradores.filter(x=>x.id!==id); afterMutate(); }); break;

    case 'add-treinamento': openTreinamentoModal(); break;
    case 'edit-treinamento': openTreinamentoModal(state.treinamentos.find(x=>x.id===id)); break;
    case 'del-treinamento': confirmDelete(()=>{ state.treinamentos = state.treinamentos.filter(x=>x.id!==id); afterMutate(); }); break;

    case 'add-inspecao': openInspecaoModal(); break;
    case 'edit-inspecao': openInspecaoModal(state.inspecoes.find(x=>x.id===id)); break;
    case 'del-inspecao': confirmDelete(()=>{ state.inspecoes = state.inspecoes.filter(x=>x.id!==id); afterMutate(); }); break;
    case 'toggle-inspecao': { const it=state.inspecoes.find(x=>x.id===id); if(it){ it.feito=!it.feito; afterMutate(); } break; }

    case 'add-aviso': openAvisoModal(); break;
    case 'edit-aviso': openAvisoModal(state.avisos.find(x=>x.id===id)); break;
    case 'del-aviso': confirmDelete(()=>{ state.avisos = state.avisos.filter(x=>x.id!==id); syncLayoutWithAvisos(); afterMutate(); }); break;

    case 'save-config': {
      state.config.titulo = document.getElementById('cfgTitulo').value.trim() || state.config.titulo;
      state.config.subtitulo = document.getElementById('cfgSub').value.trim();
      afterMutate(); toast('Identidade atualizada', ICONS.check);
      break;
    }
    case 'save-intervalo': {
      let v = parseInt(document.getElementById('cfgIntervalo').value,10);
      if(isNaN(v) || v<4) v=4; if(v>120) v=120;
      state.config.intervalo = v;
      afterMutate(); toast('Tempo padrão atualizado', ICONS.check);
      break;
    }
    case 'del-afastamento': {
      state.afastamentos = (state.afastamentos||[]).filter(a=>a.id!==id);
      afterMutate(); toast('Afastamento removido', ICONS.check);
      break;
    }
  }
}
function afterMutate(){ renderAll(); saveLocalBackup(); saveState(true); }
function confirmDelete(fn){ openConfirmModal('Remover item', 'Tem certeza que deseja remover este item? Essa ação não pode ser desfeita.', fn); }

/* ---- Layout tab: drag & drop + controls ---- */
function bindLayoutEvents(){
  const list = document.getElementById('layoutList');
  if(!list) return;
  let dragIdx = null;
  list.querySelectorAll('.layout-item').forEach(el=>{
    el.addEventListener('dragstart', ()=>{ dragIdx = parseInt(el.dataset.idx,10); el.classList.add('dragging'); });
    el.addEventListener('dragend', ()=>{ el.classList.remove('dragging'); list.querySelectorAll('.layout-item').forEach(x=>x.classList.remove('drag-over')); });
    el.addEventListener('dragover', e=>{ e.preventDefault(); el.classList.add('drag-over'); });
    el.addEventListener('dragleave', ()=> el.classList.remove('drag-over'));
    el.addEventListener('drop', e=>{
      e.preventDefault(); el.classList.remove('drag-over');
      const dropIdx = parseInt(el.dataset.idx,10);
      if(dragIdx===null || dragIdx===dropIdx) return;
      const arr = state.config.layout;
      const [moved] = arr.splice(dragIdx,1);
      arr.splice(dropIdx,0,moved);
      afterMutate(); activeTab='config'; renderTabbar(); renderContent();
    });
  });
  list.querySelectorAll('[data-role="toggle"]').forEach(t=>{
    t.addEventListener('click', ()=>{
      const i = parseInt(t.dataset.idx,10);
      state.config.layout[i].visible = !state.config.layout[i].visible;
      afterMutate(); activeTab='config'; renderTabbar(); renderContent();
    });
  });
  list.querySelectorAll('[data-role="up"]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const i = parseInt(b.dataset.idx,10); if(i<=0) return;
      const arr = state.config.layout; [arr[i-1],arr[i]] = [arr[i],arr[i-1]];
      afterMutate(); activeTab='config'; renderTabbar(); renderContent();
    });
  });
  list.querySelectorAll('[data-role="down"]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const i = parseInt(b.dataset.idx,10); const arr = state.config.layout; if(i>=arr.length-1) return;
      [arr[i+1],arr[i]] = [arr[i],arr[i+1]];
      afterMutate(); activeTab='config'; renderTabbar(); renderContent();
    });
  });
  list.querySelectorAll('[data-role="dur"]').forEach(inp=>{
    inp.addEventListener('change', ()=>{
      const i = parseInt(inp.dataset.idx,10);
      const v = inp.value.trim();
      state.config.layout[i].duracao = v==='' ? null : Math.min(120, Math.max(4, parseInt(v,10)||state.config.intervalo));
      saveState(true);
    });
  });
}

function traduzErroAuth(err){
  const map = {
    'auth/wrong-password':'senha incorreta.',
    'auth/invalid-credential':'senha incorreta.',
    'auth/user-not-found':'ainda não existe senha cadastrada.',
    'auth/email-already-in-use':'já existe uma senha cadastrada para este e-mail.',
    'auth/weak-password':'a senha precisa ter pelo menos 6 caracteres.',
    'auth/too-many-requests':'muitas tentativas — aguarde um pouco e tente de novo.',
    'auth/network-request-failed':'falha de conexão — verifique sua internet.',
  };
  return map[err && err.code] || (err && err.message) || 'erro desconhecido.';
}
function openUnlockModal(){
  let mode = 'login';
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:400px;">
      <div class="modal-head"><h3 id="unlockTitle">Acesso à edição</h3><button class="modal-close" id="mClose">${ICONS.x}</button></div>
      <div class="modal-body" id="unlockBody"></div>
      <div class="modal-foot"><button class="btn btn-ghost" id="mCancel">Cancelar</button><button class="btn btn-primary" id="unlockAction">Entrar</button></div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#mClose').addEventListener('click', close);
  overlay.querySelector('#mCancel').addEventListener('click', close);

  function render(){
    const titleEl = overlay.querySelector('#unlockTitle');
    const body = overlay.querySelector('#unlockBody');
    const actionBtn = overlay.querySelector('#unlockAction');
    if(mode==='create'){
      titleEl.textContent = 'Primeiro acesso — criar senha';
      body.innerHTML = `
        <p style="font-size:13px; color:var(--text-mid); margin-bottom:14px; line-height:1.5;">Defina a senha que você vai usar para editar o painel. E-mail associado: <b>${ADMIN_EMAIL}</b>.</p>
        <div class="field-group"><label class="field-label">Nova senha (mínimo 6 caracteres)</label><input class="field-input" type="password" id="fPass1"></div>
        <div class="field-group"><label class="field-label">Confirmar senha</label><input class="field-input" type="password" id="fPass2"></div>
        <a href="#" id="linkVoltar" style="font-size:12.5px; color:var(--accent-amber);">Já tenho senha — voltar para o login</a>`;
      actionBtn.textContent = 'Criar senha';
    } else if(mode==='reset'){
      titleEl.textContent = 'Recuperar senha';
      body.innerHTML = `
        <p style="font-size:13px; color:var(--text-mid); margin-bottom:14px; line-height:1.5;">Vamos enviar um link de redefinição de senha para <b>${ADMIN_EMAIL}</b>.</p>
        <a href="#" id="linkVoltar" style="font-size:12.5px; color:var(--accent-amber);">Voltar para o login</a>`;
      actionBtn.textContent = 'Enviar link';
    } else {
      titleEl.textContent = 'Acesso à edição';
      body.innerHTML = `
        <div class="field-group"><label class="field-label">Senha</label><input class="field-input" type="password" id="fPass1" placeholder="Digite sua senha"></div>
        <div style="display:flex; justify-content:space-between; margin-top:6px; flex-wrap:wrap; gap:6px;">
          <a href="#" id="linkCriar" style="font-size:12.5px; color:var(--text-mid);">Primeiro acesso? Defina sua senha</a>
          <a href="#" id="linkEsqueci" style="font-size:12.5px; color:var(--text-mid);">Esqueci minha senha</a>
        </div>`;
      actionBtn.textContent = 'Entrar';
    }
    const back = overlay.querySelector('#linkVoltar'); if(back) back.addEventListener('click', e=>{ e.preventDefault(); mode='login'; render(); });
    const lc = overlay.querySelector('#linkCriar'); if(lc) lc.addEventListener('click', e=>{ e.preventDefault(); mode='create'; render(); });
    const le = overlay.querySelector('#linkEsqueci'); if(le) le.addEventListener('click', e=>{ e.preventDefault(); mode='reset'; render(); });
    const p1 = overlay.querySelector('#fPass1'); if(p1){ p1.focus(); p1.addEventListener('keydown', e=>{ if(e.key==='Enter') actionBtn.click(); }); }
  }
  overlay.querySelector('#unlockAction').addEventListener('click', async ()=>{
    if(!firebaseReady || !auth){ toast('Autenticação indisponível (Firebase não conectado)', ICONS.x); return; }
    const actionBtn = overlay.querySelector('#unlockAction');
    actionBtn.disabled = true;
    try{
      if(mode==='create'){
        const p1 = overlay.querySelector('#fPass1').value;
        const p2 = overlay.querySelector('#fPass2').value;
        if(p1.length<6){ toast('A senha precisa ter pelo menos 6 caracteres', ICONS.x); actionBtn.disabled=false; return; }
        if(p1!==p2){ toast('As senhas não coincidem', ICONS.x); actionBtn.disabled=false; return; }
        await auth.createUserWithEmailAndPassword(ADMIN_EMAIL, p1);
        toast('Senha criada — bem-vindo(a)!', ICONS.check);
        close(); exitTvMode();
      } else if(mode==='reset'){
        await auth.sendPasswordResetEmail(ADMIN_EMAIL);
        toast('Link enviado para '+ADMIN_EMAIL, ICONS.check);
        mode='login'; render();
      } else {
        const p1 = overlay.querySelector('#fPass1').value;
        if(!p1){ toast('Digite sua senha', ICONS.x); actionBtn.disabled=false; return; }
        await auth.signInWithEmailAndPassword(ADMIN_EMAIL, p1);
        toast('Bem-vindo(a)!', ICONS.check);
        close(); exitTvMode();
      }
    }catch(err){
      if(mode==='login' && err && err.code==='auth/user-not-found'){ mode='create'; render(); toast('Ainda não existe senha — crie a sua', ICONS.x); }
      else{ toast('Não foi possível: '+traduzErroAuth(err), ICONS.x); }
    }
    actionBtn.disabled = false;
  });
  render();
}
function openModal(title, bodyHtml, onSave, saveLabel){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal">
      <div class="modal-head"><h3>${title}</h3><button class="modal-close" id="mClose">${ICONS.x}</button></div>
      <div class="modal-body">${bodyHtml}</div>
      <div class="modal-foot"><button class="btn btn-ghost" id="mCancel">Cancelar</button><button class="btn btn-primary" id="mSave">${ICONS.check}${saveLabel||'Salvar'}</button></div>
    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#mClose').addEventListener('click', close);
  overlay.querySelector('#mCancel').addEventListener('click', close);
  overlay.querySelector('#mSave').addEventListener('click', ()=>{ if(onSave(overlay)!==false) close(); });
  return overlay;
}
function openConfirmModal(title, msg, onConfirm){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="modal" style="max-width:420px;">
      <div class="modal-head"><h3>${title}</h3><button class="modal-close" id="mClose">${ICONS.x}</button></div>

    </div>`;
  document.body.appendChild(overlay);
  const close = ()=> overlay.remove();
  overlay.addEventListener('click', e=>{ if(e.target===overlay) close(); });
  overlay.querySelector('#mClose').addEventListener('click', close);
  overlay.querySelector('#mCancel').addEventListener('click', close);
  overlay.querySelector('#mConfirm').addEventListener('click', ()=>{ onConfirm(); close(); });
}

function openAgendamentoModal(item){
  const isEdit = !!item;
  item = item || {id:uid(), transportador:'', motorista:'', senha:'B', data:todayISO(), carga:'', local:LOCAL_OPTIONS[0], veiculo:'carreta', status:'aguardando'};
  const isCustomLocal = !LOCAL_OPTIONS.includes(item.local);
  const bancos = state.config.bancos || {transportadores:[],motoristas:[],cargas:[]};
  const body = `
    <div class="field-group">
      <label class="field-label">Tipo de veículo</label>
      <div class="vpick">
        ${VEHICLE_TYPES.map(v=>`<label>
            <input type="radio" name="veiculo" value="${v}" ${item.veiculo===v?'checked':''}>
            <div class="vopt">${vehicleIcon(v)}<span>${vehicleLabel(v)}</span></div>
          </label>`).join('')}
      </div>
    </div>
    <div class="row3">
      <div class="field-group"><label class="field-label">Senha</label><input class="field-input" id="fSenha" value="${escAttr(item.senha||'B')}" placeholder="Ex: B123" style="text-transform:uppercase;"></div>
      <div class="field-group" style="grid-column:span 2;">
        <label class="field-label">Transportador</label>
        <input class="field-input" id="fTransportador" list="dlTransportador" value="${escAttr(item.transportador)}" placeholder="Clique ou digite a inicial..." autocomplete="off">
        <datalist id="dlTransportador">${bancos.transportadores.map(v=>`<option value="${escAttr(v)}">`).join('')}</datalist>
      </div>
    </div>
    <div class="field-group">
      <label class="field-label">Motorista</label>
      <input class="field-input" id="fMotorista" list="dlMotorista" value="${escAttr(item.motorista)}" placeholder="Clique ou digite a inicial..." autocomplete="off">
      <datalist id="dlMotorista">${bancos.motoristas.map(v=>`<option value="${escAttr(v)}">`).join('')}</datalist>
    </div>
    <div class="field-group"><label class="field-label">Data</label><input class="field-input" type="date" id="fData" value="${item.data}"></div>
    <div class="field-group">
      <label class="field-label">Carga</label>
      <input class="field-input" id="fCarga" list="dlCarga" value="${escAttr(item.carga)}" placeholder="Clique ou digite a inicial..." autocomplete="off">
      <datalist id="dlCarga">${bancos.cargas.map(v=>`<option value="${escAttr(v)}">`).join('')}</datalist>
    </div>
    <div class="field-group">
      <label class="field-label">Local de descarregamento</label>
      <select class="field-select" id="fLocalSelect">
        ${LOCAL_OPTIONS.map(o=>`<option value="${escAttr(o)}" ${item.local===o?'selected':''}>${esc(o)}</option>`).join('')}
        <option value="__outro__" ${isCustomLocal?'selected':''}>Outro (digitar)...</option>
      </select>
      <input class="field-input" id="fLocalCustom" style="margin-top:8px; ${isCustomLocal?'':'display:none;'}" placeholder="Digite o local" value="${isCustomLocal?escAttr(item.local):''}">
    </div>`;
  const overlay = openModal(isEdit?'Editar Agendamento':'Novo Agendamento', body, (ov)=>{
    const veiculo = ov.querySelector('input[name="veiculo"]:checked')?.value || 'leve';
    const selLocal = ov.querySelector('#fLocalSelect').value;
    const local = selLocal==='__outro__' ? ov.querySelector('#fLocalCustom').value.trim() : selLocal;
    const transportador = ov.querySelector('#fTransportador').value.trim();
    const motorista = ov.querySelector('#fMotorista').value.trim();
    const carga = ov.querySelector('#fCarga').value.trim();
    let senha = ov.querySelector('#fSenha').value.trim().toUpperCase();
    if(!senha.startsWith('B')) senha = 'B' + senha.replace(/^B+/,'');
    const updated = {
      ...item,
      transportador, motorista, senha,
      data: ov.querySelector('#fData').value || todayISO(),
      carga,
      local, veiculo,
      status: item.status || 'aguardando',
    };
    if(!updated.transportador || !updated.motorista){ toast('Preencha transportador e motorista', ICONS.x); return false; }
    if(!local){ toast('Informe o local de descarregamento', ICONS.x); return false; }
    const idx = state.agendamentos.findIndex(x=>x.id===item.id);
    if(idx>=0) state.agendamentos[idx]=updated; else state.agendamentos.push(updated);
    addBancoItem('transportadores', transportador);
    addBancoItem('motoristas', motorista);
    addBancoItem('cargas', carga);
    afterMutate();
  }, isEdit?'Salvar alterações':'Adicionar');
  overlay.querySelector('#fLocalSelect').addEventListener('change', e=>{
    overlay.querySelector('#fLocalCustom').style.display = e.target.value==='__outro__' ? 'block' : 'none';
  });
  const senhaInput = overlay.querySelector('#fSenha');
  senhaInput.addEventListener('input', ()=>{
    let v = senhaInput.value.toUpperCase();
    if(!v.startsWith('B')) v = 'B' + v.replace(/^B+/,'');
    const pos = senhaInput.selectionStart;
    senhaInput.value = v;
    senhaInput.setSelectionRange(pos, pos);
  });
}

function openColaboradorModal(item){
  const isEdit = !!item;
  item = item || {id:uid(), nome:'', almoco:'12:00 - 13:00', alocacoes:[], alocacaoObs:'', observacoes:'', foto:'', email:'', whatsapp:''};
  const alocSet = new Set(item.alocacoes||[]);
  let currentFoto = item.foto || '';
  function fotoSlotHtml(){
    return currentFoto
      ? `<div class="imgpreview-wrap" style="display:inline-block;"><img src="${currentFoto}" alt="" style="max-height:120px; border-radius:50%; width:120px; height:120px; object-fit:cover;"><button type="button" class="imgpreview-remove" id="fFotoRemove">${ICONS.x}</button></div>`
      : `<label class="imgup" id="fotoUpLabel" style="display:inline-flex; flex-direction:column; align-items:center; width:120px; height:120px; border-radius:50%; justify-content:center; padding:0;">
          ${ICONS.inbox}
          <input type="file" accept="image/*" id="fFotoInput" style="display:none;">
        </label>`;
  }
  const body = `
    <div class="field-group" style="text-align:center;">
      <label class="field-label">Foto (opcional)</label>
      <div id="fotoSlot">${fotoSlotHtml()}</div>
    </div>
    <div class="field-group"><label class="field-label">Nome</label><input class="field-input" id="fNome" value="${escAttr(item.nome)}" placeholder="Nome do colaborador"></div>
    <div class="row2">
      <div class="field-group"><label class="field-label">E-mail (opcional)</label><input class="field-input" type="email" id="fEmail" value="${escAttr(item.email)}" placeholder="nome@hydro.com"></div>
      <div class="field-group"><label class="field-label">WhatsApp (opcional)</label><input class="field-input" type="tel" id="fWhats" value="${escAttr(item.whatsapp)}" placeholder="Ex: 5591988887777"></div>
    </div>
    <div class="field-hint" style="margin:-6px 0 4px;">E-mail e WhatsApp não aparecem no Modo TV — servem só para o botão de enviar o agendamento do dia (aba Configurações).</div>
    <div class="field-group"><label class="field-label">Horário de almoço</label><input class="field-input" id="fAlmoco" value="${escAttr(item.almoco)}" placeholder="Ex: 12:00 - 13:00"></div>
    <div class="field-group">
      <label class="field-label">Alocação atual</label>
      <div class="swatchrow" id="alocGrid" style="display:flex; flex-wrap:wrap; gap:8px;">
        ${ALOCACAO_OPTIONS.map(o=>`
          <label style="display:flex; align-items:center; gap:6px; border:1px solid var(--line); border-radius:8px; padding:6px 10px; font-size:13px; cursor:pointer;">
            <input type="checkbox" class="fAlocChk" value="${escAttr(o)}" ${alocSet.has(o)?'checked':''}> ${esc(o)}
          </label>`).join('')}
      </div>
      <div class="field-hint">Turnista Turma A/B/C/D segue automaticamente a escala oficial de revezamento (dia 07:00–19:00, noite 19:00–07:00) — só é possível marcar uma turma por vez. Quem não é Turnista é considerado turno Administrativo.</div>
    </div>
    <div class="field-group"><label class="field-label">Outras informações de alocação (opcional)</label><input class="field-input" id="fAlocObs" value="${escAttr(item.alocacaoObs)}" placeholder="Qualquer outra informação de alocação"></div>
    <div class="field-hint" style="margin:-4px 0 4px;">Presença é calculada automaticamente: Administrativo fica Presente de seg. a sex., 07:40–16:30 (fora disso, Folga); Turnista segue a escala real. Durante o almoço aparece "Almoço". Para marcar férias ou ausência temporária, use a aba Configurações → Férias e Ausências.</div>
    <div class="field-group"><label class="field-label">Observações</label><textarea class="field-textarea" id="fObs" placeholder="Qualquer informação adicional">${esc(item.observacoes)}</textarea></div>`;
  const overlay = openModal(isEdit?'Editar Colaborador':'Novo Colaborador', body, (ov)=>{
    const alocacoes = Array.from(ov.querySelectorAll('.fAlocChk:checked')).map(el=>el.value);
    const updated = { ...item,
      nome: ov.querySelector('#fNome').value.trim(),
      email: ov.querySelector('#fEmail').value.trim(),
      whatsapp: ov.querySelector('#fWhats').value.trim().replace(/[^\d]/g,''),
      foto: currentFoto,
      almoco: ov.querySelector('#fAlmoco').value.trim(),
      alocacoes,
      alocacaoObs: ov.querySelector('#fAlocObs').value.trim(),
      observacoes: ov.querySelector('#fObs').value.trim(),
    };
    if(!updated.nome){ toast('Preencha o nome', ICONS.x); return false; }
    const idx = state.colaboradores.findIndex(x=>x.id===item.id);
    if(idx>=0) state.colaboradores[idx]=updated; else state.colaboradores.push(updated);
    afterMutate();
  }, isEdit?'Salvar alterações':'Adicionar');
  overlay.querySelectorAll('.fAlocChk').forEach(chk=> chk.addEventListener('change', ()=>{
    if(chk.checked && chk.value.startsWith('Turnista Turma ')){
      overlay.querySelectorAll('.fAlocChk').forEach(other=>{
        if(other!==chk && other.value.startsWith('Turnista Turma ')) other.checked = false;
      });
    }
  }));
  function bindFotoSlot(){
    const input = overlay.querySelector('#fFotoInput');
    if(input){ input.addEventListener('change', async e=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      try{
        toast('Processando foto…', ICONS.refresh);
        currentFoto = await readImageAsCompressedDataURL(file, 400, 0.8);
        overlay.querySelector('#fotoSlot').innerHTML = fotoSlotHtml();
        bindFotoSlot();
      }catch(err){ toast('Não foi possível carregar essa foto', ICONS.x); }
    }); }
    const removeBtn = overlay.querySelector('#fFotoRemove');
    if(removeBtn){ removeBtn.addEventListener('click', ()=>{ currentFoto=''; overlay.querySelector('#fotoSlot').innerHTML = fotoSlotHtml(); bindFotoSlot(); }); }
  }
  bindFotoSlot();
}
