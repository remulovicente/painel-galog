/* Lê qualquer arquivo (vídeo, GIF, etc.) como data URL, sem recomprimir —
   usado quando não dá para passar pelo canvas sem perder a animação. */
function readFileAsDataURL(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = ()=> reject(new Error('Falha ao ler o arquivo'));
    reader.onload = ()=> resolve(reader.result);
    reader.readAsDataURL(file);
  });
}
const MAX_MEDIA_RAW_BYTES = 900*1024; // ~900KB — o documento inteiro no Firestore tem limite de 1MB
/* Processa o arquivo escolhido no aviso: imagens estáticas são redimensionadas
   e comprimidas; GIFs e vídeos são mantidos como estão (não dá para passar
   por canvas sem perder a animação), respeitando um limite de tamanho. */
async function processAvisoMedia(file){
  if(!file) throw new Error('Nenhum arquivo selecionado');
  const isVideo = file.type.startsWith('video/');
  const isGif = file.type === 'image/gif';
  const isImage = file.type.startsWith('image/');
  if(!isVideo && !isImage) throw new Error('Formato não suportado. Envie uma imagem, GIF ou vídeo.');
  if((isVideo || isGif) && file.size > MAX_MEDIA_RAW_BYTES){
    throw new Error(`Arquivo muito grande (${(file.size/1024/1024).toFixed(1)}MB). Para vídeos e GIFs o limite é ${(MAX_MEDIA_RAW_BYTES/1024).toFixed(0)}KB — tente um clipe mais curto ou mais comprimido.`);
  }
  if(isImage && !isGif){
    const src = await readImageAsCompressedDataURL(file);
    return {tipo:'imagem', src};
  }
  const src = await readFileAsDataURL(file);
  return {tipo: isVideo ? 'video' : 'imagem', src};
}
function openAvisoModal(item){
  const isEdit = !!item;
  item = item || {id:uid(), titulo:'', mensagem:'', cor:'amber', midiaTipo:'', midiaSrc:''};
  let currentSrc = item.midiaSrc || '';
  let currentTipo = item.midiaTipo || '';
  function previewHtml(){
    if(!currentSrc) return `
        <label class="imgup" id="imgUpLabel">
          ${ICONS.inbox}
          <p>Clique para selecionar uma imagem, GIF ou vídeo</p>
          <input type="file" accept="image/*,video/*" id="fAvImgInput">
        </label>`;
    const mediaTag = currentTipo==='video'
      ? `<video src="${currentSrc}" muted loop autoplay playsinline></video>`
      : `<img src="${currentSrc}" alt="Prévia">`;
    return `
        <div class="imgpreview-wrap">
          ${mediaTag}
          <button type="button" class="imgpreview-remove" id="fAvImgRemove">${ICONS.x}</button>
        </div>`;
  }
  const body = `
    <div class="field-group"><label class="field-label">Título</label><input class="field-input" id="fAvTitulo" value="${escAttr(item.titulo)}" placeholder="Ex: Uso de EPI obrigatório"></div>
    <div class="field-group"><label class="field-label">Mensagem</label><textarea class="field-textarea" id="fAvMsg" placeholder="Texto do aviso">${esc(item.mensagem)}</textarea></div>
    <div class="field-group">
      <label class="field-label">Imagem, GIF ou vídeo (opcional)</label>
      <div id="imgSlot">${previewHtml()}</div>
      <div class="field-hint">Aparece no painel de avisos e em tela cheia no Modo TV. Fotos são redimensionadas automaticamente; GIFs e vídeos são mantidos como estão, com limite de ${(MAX_MEDIA_RAW_BYTES/1024).toFixed(0)}KB (arquivo maior que isso não cabe no banco de dados — tente um clipe mais curto ou mais comprimido). No Modo TV, vídeos tocam em loop e sem som.</div>
    </div>
    <div class="field-group">
      <label class="field-label">Cor de destaque</label>
      <div class="swatchrow" id="swatchRow">
        <div class="swatch ${item.cor==='amber'?'selected':''}" data-cor="amber" style="background:var(--accent-amber)"></div>
        <div class="swatch ${item.cor==='teal'?'selected':''}" data-cor="teal" style="background:var(--accent-teal)"></div>
        <div class="swatch ${item.cor==='red'?'selected':''}" data-cor="red" style="background:var(--accent-red)"></div>
        <div class="swatch ${item.cor==='violet'?'selected':''}" data-cor="violet" style="background:var(--accent-violet)"></div>
      </div>
    </div>`;
  const overlay = openModal(isEdit?'Editar Aviso':'Novo Aviso', body, (ov)=>{
    const cor = ov.querySelector('.swatch.selected')?.dataset.cor || 'amber';
    const updated = {...item, titulo: ov.querySelector('#fAvTitulo').value.trim(), mensagem: ov.querySelector('#fAvMsg').value.trim(), cor, midiaTipo: currentTipo, midiaSrc: currentSrc};
    if(!updated.titulo){ toast('Preencha o título do aviso', ICONS.x); return false; }
    const idx = state.avisos.findIndex(x=>x.id===item.id);
    if(idx>=0) state.avisos[idx]=updated; else state.avisos.push(updated);
    syncLayoutWithAvisos();
    afterMutate();
  }, isEdit?'Salvar alterações':'Adicionar');
  overlay.querySelectorAll('.swatch').forEach(s=> s.addEventListener('click', ()=>{ overlay.querySelectorAll('.swatch').forEach(x=>x.classList.remove('selected')); s.classList.add('selected'); }));

  function renderImgSlot(){
    const slot = overlay.querySelector('#imgSlot');
    if(!slot) return;
    slot.innerHTML = previewHtml();
    bindImgSlot();
  }
  function bindImgSlot(){
    const input = overlay.querySelector('#fAvImgInput');
    if(input){ input.addEventListener('change', async e=>{
      const file = e.target.files && e.target.files[0];
      if(!file) return;
      try{
        toast('Processando arquivo…', ICONS.refresh);
        const res = await processAvisoMedia(file);
        currentSrc = res.src; currentTipo = res.tipo;
        renderImgSlot();
      }catch(err){ toast(err.message || 'Não foi possível carregar esse arquivo', ICONS.x); }
    }); }
    const removeBtn = overlay.querySelector('#fAvImgRemove');
    if(removeBtn){ removeBtn.addEventListener('click', ()=>{ currentSrc = ''; currentTipo = ''; renderImgSlot(); }); }
  }
  bindImgSlot();
}

/* =========================================================
   MODO TV
   ========================================================= */
let tvSlides = [];
let tvIndex = 0;
let tvTimerStart = 0;
let tvRAF = null;
let tvActive = false;
let tvDateFilter = 'hoje';

function buildTvSlides(){
  const slides = [];
  state.config.layout.filter(l=>l.visible).forEach(l=>{
    if(l.tipo==='quadro'){
      if(l.id==='geral'){
        /* Dividido em dois slides cheios (um para Treinamentos, outro para
           Inspeção 5S) em vez de duas colunas espremidas — assim cada um
           tem a tela toda e pode rolar sozinho se tiver muitos registros. */
        slides.push({type:'treinamentos', duracao:l.duracao});
        slides.push({type:'inspecoes', duracao:l.duracao});
      } else {
        slides.push({type:l.id, duracao:l.duracao});
      }
    }
    else { const a = state.avisos.find(x=>x.id===l.id); if(a) slides.push({type:'aviso', data:a, duracao:l.duracao}); }
  });
  return slides;
}
function tvAvailableDates(){ return Array.from(new Set(state.agendamentos.map(a=>a.data))).sort(); }
/* Data efetiva do quadro "Agendamentos do Dia" quando o filtro é "hoje":
   usa o dia atual; se não houver nenhum agendamento hoje, usa a próxima
   data futura que tiver agendamento. */
function tvEffectiveDate(){
  const hoje = todayISO();
  const datas = tvAvailableDates();
  if(datas.includes(hoje)) return hoje;
  const futura = datas.filter(d=>d>hoje).sort()[0];
  return futura || hoje;
}
function refreshTvDateFilter(){
  const sel = document.getElementById('tvDateFilterSelect');
  const dates = tvAvailableDates();
  const prev = tvDateFilter;
  sel.innerHTML = `<option value="hoje">Hoje</option><option value="todas">Todas as datas</option>` + dates.map(d=>`<option value="${d}">${fmtDate(d)}</option>`).join('');
  sel.value = (prev==='hoje' || prev==='todas' || dates.includes(prev)) ? prev : 'hoje';
  tvDateFilter = sel.value;
}

function enterTvMode(){
  tvActive = true; tvSlides = buildTvSlides(); tvIndex = 0;
  document.getElementById('tvRoot').classList.add('active');
  document.getElementById('btnTvMode').classList.add('active');
  document.getElementById('btnEditMode').classList.remove('active');
  refreshTvDateFilter();
  renderTvSlide(); startTvTimer();
}
function exitTvMode(){
  tvActive = false;
  document.getElementById('tvRoot').classList.remove('active');
  document.getElementById('btnTvMode').classList.remove('active');
  document.getElementById('btnEditMode').classList.add('active');
  cancelAnimationFrame(tvRAF);
}
function requestUnlock(){
  if(!tvActive) return;
  if(firebaseReady && auth && auth.currentUser){ exitTvMode(); return; }
  openUnlockModal();
}
document.getElementById('btnTvMode').addEventListener('click', enterTvMode);
document.getElementById('btnEditMode').addEventListener('click', exitTvMode);
document.getElementById('btnUnlockDot').addEventListener('click', requestUnlock);
document.getElementById('tvDateFilterSelect').addEventListener('change', e=>{ tvDateFilter = e.target.value; if(tvSlides[tvIndex] && tvSlides[tvIndex].type==='agendamentos') renderTvSlide(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && tvActive) requestUnlock(); });

function currentSlideDuration(){
  const s = tvSlides[tvIndex];
  const d = s && s.duracao ? s.duracao : state.config.intervalo;
  return Math.max(4, d);
}
function startTvTimer(){
  tvTimerStart = performance.now();
  cancelAnimationFrame(tvRAF);
  const durationMs = currentSlideDuration()*1000;
  function step(now){
    const elapsed = now - tvTimerStart;
    const progress = Math.min(1, elapsed/durationMs);
    document.getElementById('tvProgressBar').style.width = (progress*100)+'%';
    const scrollEl = document.getElementById('tvScroll');
    if(scrollEl){
      const maxScroll = scrollEl.scrollHeight - scrollEl.clientHeight;
      if(maxScroll > 6){
        /* Pausa no início e no fim, rola suavemente no meio — dá tempo de ler
           o topo e o final da lista, mesmo com muitos registros. */
        const p1 = 0.14, p2 = 0.86;
        let sp;
        if(progress<=p1) sp = 0;
        else if(progress>=p2) sp = 1;
        else sp = (progress-p1)/(p2-p1);
        const eased = 0.5 - 0.5*Math.cos(Math.PI*sp);
        scrollEl.scrollTop = eased * maxScroll;
      }
    }
    if(elapsed >= durationMs){ nextTvSlide(); return; }
    tvRAF = requestAnimationFrame(step);
  }
  document.getElementById('tvProgressBar').style.width='0%';
  tvRAF = requestAnimationFrame(step);
}
function nextTvSlide(){ if(tvSlides.length===0) return; tvIndex=(tvIndex+1)%tvSlides.length; renderTvSlide(); startTvTimer(); }
function gotoTvSlide(i){ tvIndex=i; renderTvSlide(); startTvTimer(); }

function renderTvSlide(){
  const body = document.getElementById('tvBody');
  const dotsWrap = document.getElementById('tvDots');
  if(tvSlides.length===0){ body.innerHTML = `<div class="tv-empty">Nenhum quadro ativo. Habilite quadros na aba Layout &amp; Config.</div>`; dotsWrap.innerHTML=''; return; }
  const slide = tvSlides[tvIndex];
  body.innerHTML = `<div class="tv-slide showing"><div class="tv-scroll" id="tvScroll">${tvSlideHtml(slide)}</div></div>`;
  dotsWrap.innerHTML = tvSlides.map((s,i)=>`<div class="tv-dot ${i===tvIndex?'active':''}" data-i="${i}"></div>`).join('');
  dotsWrap.querySelectorAll('.tv-dot').forEach(d=> d.addEventListener('click', ()=> gotoTvSlide(parseInt(d.dataset.i,10))));
  document.getElementById('tvFilterWrap').style.visibility = slide.type==='agendamentos' ? 'visible' : 'hidden';
}

const AG_STATUS_TV_MAP = { aguardando:['var(--accent-amber-dim)','var(--accent-amber)','Aguardando'], recebido:['var(--accent-teal-dim)','var(--accent-teal)','Recebido'], nao_recebido:['var(--accent-red-dim)','#ff8fa3','Não recebido'] };
function tvBadgeAgendamentoBtn(r){
  const [bg,fg,label] = AG_STATUS_TV_MAP[r.status] || AG_STATUS_TV_MAP.aguardando;
  return `<span class="tv-badge clickable" data-tvtoggle="${r.id}" style="background:${bg}; color:${fg};"><span class="bdot" style="background:${fg}"></span>${label}</span>`;
}
function tvBadgeColaborador(status){
  const map = {presente:['var(--accent-teal-dim)','var(--accent-teal)','Presente'], almoco:['var(--accent-amber-dim)','var(--accent-amber)','Almoço'], ferias:['var(--accent-violet-dim)','var(--accent-violet)','Férias'], folga:['var(--bg-panel)','var(--text-low)','Folga'], ausente:['var(--accent-red-dim)','#ff8fa3','Ausente']};
  const [bg,fg,label] = map[status]||map.presente;
  return `<span class="tv-badge" style="background:${bg}; color:${fg};"><span class="bdot" style="background:${fg}"></span>${label}</span>`;
}

function tvSlideHtml(slide){
  if(slide.type==='agendamentos'){
    let rows = state.agendamentos.slice();
    const hoje = todayISO();
    const filtroData = tvDateFilter==='hoje' ? tvEffectiveDate() : tvDateFilter;
    if(filtroData!=='todas') rows = rows.filter(r=>r.data===filtroData);
    rows.sort((a,b)=>a.data.localeCompare(b.data));
    let label;
    if(tvDateFilter==='todas') label = 'Todas as datas';
    else if(tvDateFilter==='hoje') label = filtroData===hoje ? `Hoje — ${fmtDate(filtroData)}` : `Próxima data disponível — ${fmtDate(filtroData)}`;
    else label = fmtDate(filtroData);
    return `<div class="tv-slide-title">${ICONS.agendamentos}Agendamentos do Dia <span style="font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--text-mid); text-transform:none; letter-spacing:0;">— ${label}</span></div>
      ${rows.length===0? `<div class="tv-empty">Nenhum agendamento para esta data.</div>` : `
      <div style="border:1px solid var(--line); border-radius:12px; overflow:hidden;">
      <table class="tv-table"><thead><tr><th style="width:90px;">Veículo</th><th>Senha</th><th>Transportador</th><th>Motorista</th><th>Data</th><th>Carga</th><th>Descarreg.</th><th>Status</th></tr></thead>
      <tbody>${rows.map(r=>`
        <tr>
          <td><div class="tv-vchip"><div class="vicon">${vehicleIcon(r.veiculo)}</div></div></td>
          <td class="cell-mono">${esc(r.senha||'—')}</td>
          <td class="cell-strong">${esc(r.transportador)}</td>
          <td>${esc(r.motorista)}</td>
          <td class="cell-mono">${fmtDate(r.data)}</td>
          <td>${esc(r.carga)}</td>
          <td>${esc(r.local)}</td>
          <td>${tvBadgeAgendamentoBtn(r)}</td>
        </tr>`).join('')}</tbody></table></div>`}`;
  }
  if(slide.type==='colaboradores'){
    const rows = state.colaboradores;
    return `<div class="tv-slide-title">${ICONS.colaboradores}Colaboradores</div>
      ${rows.length===0? `<div class="tv-empty">Nenhum colaborador cadastrado.</div>` : `
      <div style="border:1px solid var(--line); border-radius:12px; overflow:hidden;">
      <table class="tv-table"><thead><tr><th style="width:56px;"></th><th>Nome</th><th>Almoço</th><th>Alocação</th><th>Status</th><th>Observações</th></tr></thead>
      <tbody>${rows.map(r=>`
        <tr>
          <td>${r.foto ? `<img src="${r.foto}" class="tv-colab-avatar" alt="">` : `<div class="tv-colab-avatar tv-colab-avatar-empty">${esc((r.nome||'?').charAt(0).toUpperCase())}</div>`}</td>
          <td class="cell-strong">${esc(r.nome)}</td>
          <td><span class="tv-lunch-pill">${esc(r.almoco)}</span></td>
          <td>${esc(alocacaoLabel(r))}</td>
          <td>${tvBadgeColaborador(colabDisplayStatus(r))}</td>
          <td class="tv-obs">${esc(r.observacoes)||'—'}</td>
        </tr>`).join('')}</tbody></table></div>`}`;
  }
  if(slide.type==='treinamentos'){
    const tr = state.treinamentos.slice().sort((a,b)=>a.vencimento.localeCompare(b.vencimento));
    return `<div class="tv-slide-title">${ICONS.clock}Treinamentos a Vencer</div>
      ${tr.length===0? `<div class="tv-empty">Nenhum treinamento cadastrado.</div>` : `
      <div style="border:1px solid var(--line); border-radius:12px; overflow:hidden;">
      <table class="tv-table"><thead><tr><th>Colaborador</th><th>Treinamento</th><th>Vence em</th></tr></thead>
      <tbody>${tr.map(r=>{
        const d = daysUntil(r.vencimento);
        const badge = d<0? `<span class="tv-badge" style="background:var(--accent-red-dim); color:#ff8fa3;"><span class="bdot" style="background:var(--accent-red)"></span>Vencido</span>`
          : d<=7? `<span class="tv-badge" style="background:var(--accent-amber-dim); color:var(--accent-amber);"><span class="bdot" style="background:var(--accent-amber)"></span>${d}d</span>`
          : `<span class="tv-badge" style="background:var(--accent-teal-dim); color:var(--accent-teal);"><span class="bdot" style="background:var(--accent-teal)"></span>${d}d</span>`;
        return `<tr><td class="cell-strong">${esc(r.nome)}</td><td>${esc(r.treinamento)}</td><td class="cell-mono">${fmtDate(r.vencimento)} ${badge}</td></tr>`;
      }).join('')}</tbody></table></div>`}`;
  }
  if(slide.type==='inspecoes'){
    const ins = state.inspecoes;
    return `<div class="tv-slide-title">${ICONS.check}Inspeção 5S</div>
      ${ins.length===0? `<div class="tv-empty">Nenhuma área cadastrada.</div>` : `
      <div style="border:1px solid var(--line); border-radius:12px; overflow:hidden;">
      <table class="tv-table"><thead><tr><th>Área</th><th>Colaborador</th><th>Status</th></tr></thead>
      <tbody>${ins.map(r=>`<tr><td class="cell-strong">${esc(r.area)}</td><td>${esc(r.responsavel)}</td><td>${r.feito? `<span class="tv-badge" style="background:var(--accent-teal-dim); color:var(--accent-teal);"><span class="bdot" style="background:var(--accent-teal)"></span>Realizada</span>` : `<span class="tv-badge" style="background:var(--accent-amber-dim); color:var(--accent-amber);"><span class="bdot" style="background:var(--accent-amber)"></span>Não realizada</span>`}</td></tr>`).join('')}</tbody></table></div>`}`;
  }
  if(slide.type==='aviso'){
    const a = slide.data; const fg = AVISO_COLORS[a.cor]||AVISO_COLORS.amber;
    return `<div class="tv-aviso" style="background:var(--bg-panel); border:1px solid var(--line);">
      ${a.midiaSrc ? (a.midiaTipo==='video' ? `<video class="tv-aviso-img" src="${a.midiaSrc}" autoplay loop muted playsinline></video>` : `<img class="tv-aviso-img" src="${a.midiaSrc}" alt="">`) : `<div style="width:64px; height:4px; border-radius:4px; background:${fg}; margin-bottom:26px;"></div>`}
      <div class="tv-aviso-title" style="color:${fg};">${esc(a.titulo)}</div>
      <div class="tv-aviso-msg">${esc(a.mensagem)}</div>
    </div>`;
  }
  return '';
}
document.getElementById('tvBody').addEventListener('click', e=>{
  const el = e.target.closest('[data-tvtoggle]');
  if(!el) return;
  const id = el.dataset.tvtoggle;
  const it = state.agendamentos.find(x=>x.id===id);
  if(it){ it.status = AG_STATUS_ORDER[(AG_STATUS_ORDER.indexOf(it.status)+1)%AG_STATUS_ORDER.length]; saveState(false); renderTvSlide(); }
});
